name: Build Punjab Test Generator APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source_xz/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reconstruct original Flutter source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app
          cat source_xz/part_*.b64 > source.b64
          base64 -d source.b64 > source.tar.xz
          tar -xJf source.tar.xz -C app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - name: Patch missing assets and source build errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The supplied ZIP references font/assets files that are not present.
          p = Path('app/pubspec.yaml')
          text = p.read_text()
          marker = '\n  assets:\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          # Upgrade legacy file_picker that still uses removed Android v1 embedding.
          text = text.replace('file_picker: ^6.1.1', 'file_picker: ^11.0.3')
          p.write_text(text)

          # Flutter stable compatibility: CardTheme -> CardThemeData.
          p = Path('app/lib/core/theme/app_theme.dart')
          text = p.read_text().replace('cardTheme: CardTheme(', 'cardTheme: CardThemeData(')
          p.write_text(text)

          # Fix invalid filter parameter in the supplied source.
          p = Path('app/lib/data/repositories/question_repository.dart')
          text = p.read_text().replace(
              '      chapterId: null,\n      questionType: current.questionType,',
              '      chapterIds: [current.chapterId],\n      questionType: current.questionType,'
          )
          p.write_text(text)

          # Fix malformed nested map literals in test serialization.
          p = Path('app/lib/data/repositories/test_repository.dart')
          text = p.read_text()
          text = text.replace("'sections': test.sections.map((s) => {\n        return {", "'sections': test.sections.map((s) => {")
          text = text.replace("'questions': s.questions.map((tq) => {\n            return {", "'questions': s.questions.map((tq) => {")
          text = text.replace(
              "              'override_marks': tq.overrideMarks,\n            };\n          }).toList(),\n        };\n      }).toList(),",
              "              'override_marks': tq.overrideMarks,\n            }).toList(),\n        }).toList(),"
          )
          p.write_text(text)

          # Null-safe Urdu attempt note handling.
          p = Path('app/lib/features/paper_editor/services/pdf_service.dart')
          text = p.read_text()
          text = text.replace(
              'if (pattern.attemptNote != null || pattern.attemptNoteUrdu.isNotEmpty) {',
              "if ((pattern.attemptNote?.isNotEmpty ?? false) || (pattern.attemptNoteUrdu?.isNotEmpty ?? false)) {"
          )
          text = text.replace(
              '? (pattern.attemptNoteUrdu.isNotEmpty ? pattern.attemptNoteUrdu : pattern.attemptNote)',
              '? ((pattern.attemptNoteUrdu?.isNotEmpty ?? false) ? pattern.attemptNoteUrdu : pattern.attemptNote)'
          )
          p.write_text(text)
          PY

      - name: Generate Android project scaffold
        working-directory: app
        run: flutter create --platforms=android --org com.punjabtestgenerator .

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/app/outputs/flutter-apk/app-release.apk
          ls -lh app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Punjab-Test-Generator-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

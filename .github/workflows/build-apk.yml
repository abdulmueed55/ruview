name: Build Punjab Test Generator APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source_xz/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reconstruct original Flutter source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app
          cat source_xz/part_*.b64 > source.b64
          base64 -d source.b64 > source.tar.xz
          tar -xJf source.tar.xz -C app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - name: Patch missing assets and source build errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/pubspec.yaml')
          text = p.read_text()
          marker = '\n  assets:\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          for dep in ['file_picker: ^6.1.1', 'connectivity_plus: ^5.0.2', 'share_plus: ^7.2.1']:
              text = text.replace('  ' + dep + '\n', '')
          if 'url_launcher:' not in text:
              text = text.replace('  http: ^1.2.0\n', '  http: ^1.2.0\n  url_launcher: ^6.3.1\n')
          p.write_text(text)

          p = Path('app/lib/core/theme/app_theme.dart')
          text = p.read_text().replace('cardTheme: CardTheme(', 'cardTheme: CardThemeData(')
          p.write_text(text)

          p = Path('app/lib/data/repositories/question_repository.dart')
          text = p.read_text().replace(
              '      chapterId: null,\n      questionType: current.questionType,',
              '      chapterIds: [current.chapterId],\n      questionType: current.questionType,'
          )
          p.write_text(text)

          p = Path('app/lib/data/repositories/test_repository.dart')
          text = p.read_text()
          text = text.replace("'sections': test.sections.map((s) => {\n        return {", "'sections': test.sections.map((s) => {")
          text = text.replace("'questions': s.questions.map((tq) => {\n            return {", "'questions': s.questions.map((tq) => {")
          text = text.replace(
              "              'override_marks': tq.overrideMarks,\n            };\n          }).toList(),\n        };\n      }).toList(),",
              "              'override_marks': tq.overrideMarks,\n            }).toList(),\n        }).toList(),"
          )
          p.write_text(text)

          p = Path('app/lib/features/paper_editor/services/pdf_service.dart')
          text = p.read_text()
          text = text.replace(
              'if (pattern.attemptNote != null || pattern.attemptNoteUrdu.isNotEmpty) {',
              "if ((pattern.attemptNote?.isNotEmpty ?? false) || (pattern.attemptNoteUrdu?.isNotEmpty ?? false)) {"
          )
          text = text.replace(
              '? (pattern.attemptNoteUrdu.isNotEmpty ? pattern.attemptNoteUrdu : pattern.attemptNote)',
              '? ((pattern.attemptNoteUrdu?.isNotEmpty ?? false) ? pattern.attemptNoteUrdu : pattern.attemptNote)'
          )
          p.write_text(text)
          PY

      - name: Add Punjab classes 5-10 textbook catalog
        shell: bash
        run: |
          cat source_xz/textbook_patch_*.b64 > textbook_patch.b64
          base64 -d textbook_patch.b64 > textbook_patch.tar.xz
          tar -xJf textbook_patch.tar.xz -C app

      - name: Apply Class 8-12 curriculum hierarchy
        shell: bash
        run: |
          cat source_xz/hierarchy_patch_*.b64 > hierarchy_patch.b64
          base64 -d hierarchy_patch.b64 > hierarchy_patch.tar.xz
          tar -xJf hierarchy_patch.tar.xz -C app

      - name: Apply verified Class 9 real curriculum data
        shell: bash
        run: |
          cat source_xz/class9_real_*.b64 > class9_real.b64
          base64 -d class9_real.b64 > class9_real.tar.xz
          tar -xJf class9_real.tar.xz -C app

      - name: Apply polished curriculum UI
        shell: bash
        run: |
          cat source_xz/ui_polish_*.b64 > ui_polish.b64
          base64 -d ui_polish.b64 > ui_polish.tar.xz
          tar -xJf ui_polish.tar.xz -C app
          grep -q "Study Content Library" app/lib/features/dashboard/screens/dashboard_screen.dart
          grep -q "Selected Topics" app/lib/features/curriculum/screens/curriculum_home_screen.dart

      - name: Generate Android project scaffold
        working-directory: app
        run: flutter create --platforms=android --org com.punjabtestgenerator .

      - name: Force modern Android compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/android/app/build.gradle.kts')
          text = p.read_text()
          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          text = text.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 35')
          p.write_text(text)
          PY

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        continue-on-error: true
        run: flutter analyze

      - name: Build smaller split APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Verify arm64 APK
        shell: bash
        run: |
          test -f app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -lh app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload small arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Punjab-Test-Generator-v1.4-polished-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

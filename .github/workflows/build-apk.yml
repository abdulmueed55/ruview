name: Build Punjab Test Generator APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source_xz/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reconstruct original Flutter source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app
          cat source_xz/part_*.b64 > source.b64
          base64 -d source.b64 > source.tar.xz
          tar -xJf source.tar.xz -C app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart
          echo "Original project restored successfully"

      - name: Remove unavailable bundled font declarations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/pubspec.yaml')
          text = p.read_text()
          marker = '\n  assets:\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          p.write_text(text)
          print(p.read_text())
          PY

      - name: Generate Android project scaffold
        working-directory: app
        run: flutter create --platforms=android --org com.punjabtestgenerator .

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -f app/build/app/outputs/flutter-apk/app-release.apk
          ls -lh app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Punjab-Test-Generator-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
